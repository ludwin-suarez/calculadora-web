<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>calculadoraWeb</title>
</head>

<body>

    <h1>Calculadora</h1>

    <form action="/calcular" method="get">

        <label for="numero1">Número 1:</label>
        <input type="number" id="numero1" name="numero1" step="any" required>

        <br><br>

        <label for="numero2">Número 2:</label>
        <input type="number" id="numero2" name="numero2" step="any" required>

        <br><br>

        <button type="submit" name="operacion" value="sumar">+</button>

        <button type="submit" name="operacion" value="restar">-</button>

        <button type="submit" name="operacion" value="multiplicar">×</button>

        <button type="submit" name="operacion" value="dividir">÷</button>

    </form>

    <h2>Resultado:</h2>

    <p th:text="${resultado}"></p>

</body>
</html>
